apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-user
  namespace: {{ .Values.dashboard.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-user-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: admin-user
    namespace: {{ .Values.dashboard.namespace }}
